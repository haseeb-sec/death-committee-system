services:
  postgres:
    image: postgres:17
    container_name: death-committee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: death_committee
      POSTGRES_USER: death_committee
      POSTGRES_PASSWORD: death_committee_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U death_committee -d death_committee"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: death-committee-backend
    restart: unless-stopped
    environment:
      SECRET_KEY: docker-compose-pilot-secret-32-characters-long
      DATABASE_URL: postgresql+psycopg://death_committee:death_committee_dev_password@postgres:5432/death_committee
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

  frontend:
    build:
      context: ./frontend
    container_name: death-committee-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
